name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Apply launcher icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-icons/* android/app/src/main/res/

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk fxthoomxstudio.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxthoomxstudio-apk
          path: fxthoomxstudio.apk
          if-no-files-found: error

      - name: Publish the APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: fxthoomxstudio v1.0.${{ github.run_number }}
          body: Install fxthoomxstudio.apk on an Android phone. Open it from your downloads and allow installs from this source if asked.
          files: fxthoomxstudio.apk
          make_latest: true
